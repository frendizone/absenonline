<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#2563eb" />
  <title>Absensi GPS</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="header">
      <h1>📍 Absensi GPS</h1>
      <p id="clock">--:--:--</p>
    </header>

    <!-- LOGIN -->
    <section id="loginSection" class="card">
      <h2>Login Karyawan</h2>
      <input type="text" id="nipInput" placeholder="NIP / ID Karyawan" inputmode="numeric" />
      <input type="password" id="password" placeholder="Password" />
      <button id="btnLogin" onclick="login()">Masuk</button>
      <p id="loginError" class="error"></p>
    </section>

    <!-- APP -->
    <section id="mainSection" class="hidden">
      <div class="card user-info">
        <div>
          <strong id="userName">-</strong>
          <small id="userNip">-</small>
        </div>
        <button class="logout" onclick="logout()">Keluar</button>
      </div>

      <div class="card">
        <h2>Lokasi Anda</h2>
        <p id="locationStatus">Mengambil lokasi...</p>
        <p id="coords">-</p>
        <p id="distance">-</p>
        <button onclick="getLocation()">🔄 Refresh Lokasi</button>
      </div>

      <div class="card actions">
        <button class="btn-in" onclick="absen('in')">✅ Check-In</button>
        <button class="btn-out" onclick="absen('out')">🚪 Check-Out</button>
      </div>

      <div class="card">
        <h2>Riwayat Absensi</h2>
        <div id="history">
          <p style="color:#94a3b8;font-size:13px">Memuat...</p>
        </div>
      </div>
    </section>
  </div>

  <!-- Supabase SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js"></script>
</body>
</html>
