<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Absensi</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="header"><h1>👨‍💼 Admin Absensi</h1></header>
    <div class="card">
      <h2>Semua Absensi (50 terakhir)</h2>
      <div id="list">Memuat...</div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const db = supabase.createClient("SUPABASE_URL_ANDA", "ANON_KEY_ANDA");

    db.auth.getSession().then(async ({ data: { session } }) => {
      if (!session) return (location.href = "index.html");

      const { data, error } = await db
        .from("absensi")
        .select("*, users(nama, nip)")
        .order("waktu", { ascending: false })
        .limit(50);

      if (error) {
        document.getElementById("list").innerHTML = `<p class="error">${error.message}</p>`;
        return;
      }

      document.getElementById("list").innerHTML = data.map(h => `
        <div class="history-item ${h.type}">
          <strong>${h.users?.nama || "-"}</strong> (${h.users?.nip || "-"}) — 
          ${h.type === "in" ? "✅ IN" : "🚪 OUT"}<br>
          ${new Date(h.waktu).toLocaleString("id-ID")}<br>
          <small>📍 ${h.jarak}m dari ${h.kantor}</small>
        </div>
      `).join("");
    });
  </script>
</body>
</html>
